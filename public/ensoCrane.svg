<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Clean Pure White Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Single Unified Charcoal/Ink Group -->
  <g fill="#2B2D31" stroke="#2B2D31">

    <!-- ==========================================
         SLIGHTLY OPEN, REFINED BRUSH ENSŌ
         (Thinner Line, Dynamic Dry-Brush Texture)
         ========================================== -->
    <g id="refined-brush-enso" stroke="none">
      
      <!-- Thinner, Slender Main Stroke Arc (Slightly Open Gap at Top-Left) -->
      <path d="M 235,62 
               C 295,58 370,82 415,132 
               C 458,185 460,265 428,335 
               C 392,408 305,435 228,425 
               C 158,415 102,358 92,282 
               C 85,228 102,175 138,132 
               C 152,115 170,100 190,88
               C 172,102 155,118 142,138
               C 112,178 98,228 105,278 
               C 112,342 162,392 225,402 
               C 292,412 370,388 402,322 
               C 430,262 428,192 392,142 
               C 352,98 288,75 235,74 Z"/>

      <!-- Feathered Dry-Brush Entry (Top Left Open Gap) -->
      <path d="M 235,52 C 262,50 292,55 318,62 C 290,66 260,68 232,74 C 198,82 168,100 142,125 C 132,135 122,148 115,162 C 112,148 120,132 135,118 C 158,95 192,72 235,52 Z"/>
      
      <path d="M 252,44 C 275,44 298,48 318,54 C 295,57 270,60 248,63 C 228,66 208,74 190,84 C 205,74 228,66 252,44 Z"/>
      
      <path d="M 198,66 C 175,78 152,95 135,115 C 130,105 145,90 165,78 C 180,68 198,66 198,66 Z"/>

      <!-- Expressive Dry-Brush Splatters & Organic Bristle Dots -->
      <circle cx="230" cy="46" r="1.8"/>
      <circle cx="215" cy="50" r="1.2"/>
      <circle cx="198" cy="58" r="2"/>
      <circle cx="182" cy="68" r="1.2"/>
      <circle cx="165" cy="80" r="1.8"/>
      <circle cx="148" cy="95" r="2.2"/>
      <circle cx="132" cy="115" r="1.5"/>
      <circle cx="118" cy="138" r="1.8"/>
      <circle cx="108" cy="162" r="1.2"/>

      <!-- Delicate Tapered Release at Tail Break (Lower Left) -->
      <path d="M 98,285 C 92,318 102,348 122,375 C 110,352 104,322 108,295 C 110,282 114,268 118,255 C 108,265 102,275 98,285 Z"/>
      
      <circle cx="92" cy="305" r="1.2"/>
      <circle cx="98" cy="328" r="1.8"/>
      <circle cx="108" cy="350" r="1.2"/>
      <circle cx="120" cy="370" r="1.5"/>
    </g>

    <!-- ==========================================
         MATCHING CRANE IN FLIGHT
         ========================================== -->
    <g id="natural-crane" fill="none" stroke="#2B2D31" transform="translate(0, 5)">
      
      <!-- Long Graceful Neck & Curved Head -->
      <path d="M 235,275 C 238,230 236,180 232,142 C 230,126 222,115 212,118 C 208,119 204,122 195,125" 
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Slender Beak -->
      <path d="M 195,125 L 175,129" stroke-width="2" stroke-linecap="round"/>

      <!-- Crown Detail -->
      <circle cx="210" cy="118" r="2.2" fill="#2B2D31" stroke="none"/>

      <!-- Left Wing (Expansive Outward Swept Feathers) -->
      <path d="M 235,225 Q 180,185 125,165" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 125,165 C 148,185 178,208 220,232" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 142,172 Q 185,200 225,242" stroke-width="1.4"/>
      <path d="M 160,180 Q 195,210 230,250" stroke-width="1.2"/>

      <!-- Right Wing (Upward Curved Trajectory) -->
      <path d="M 238,225 Q 300,180 375,155" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 375,155 C 345,182 300,210 250,235" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 358,162 Q 312,195 255,245" stroke-width="1.4"/>
      <path d="M 340,172 Q 298,205 260,255" stroke-width="1.2"/>

      <!-- Tapered Body & Tail Feather Fan -->
      <path d="M 235,225 Q 240,280 248,320" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M 238,270 L 235,328" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 242,270 L 258,325" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Long Slender Trailing Legs -->
      <path d="M 244,315 L 248,375" stroke-width="2" stroke-linecap="round"/>
      <path d="M 248,315 L 258,372" stroke-width="2" stroke-linecap="round"/>
    </g>

  </g>
</svg>
